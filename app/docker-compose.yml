services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fjm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fjm}
      POSTGRES_DB: fjm
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fjm"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fjm:${POSTGRES_PASSWORD:-fjm}@db:5432/fjm
      NODE_ENV: production
      OCR_URL: http://ocr:8765
    ports: ["4000:4000"]
    volumes: [uploads:/repo/apps/api/uploads]
    depends_on: { db: { condition: service_healthy }, ocr: { condition: service_started } }
    profiles: [full]

  # PaddleOCR PP-OCRv5 Thai via RapidOCR (docs/ocr.md); internal only, api falls back to tesseract if it's down
  ocr:
    build: ./apps/ocr
    restart: unless-stopped
    profiles: [full]

  web:
    build:
      context: .
      target: web
      args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:4000}" }
    ports: ["3000:3000"]
    depends_on: [api]
    profiles: [full]

volumes:
  # external: `docker compose down -v` will NOT delete the database (create once: docker volume create app_dbdata)
  dbdata:
    name: app_dbdata
    external: true
  uploads:
