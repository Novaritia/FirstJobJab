services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fjm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fjm}
      POSTGRES_DB: fjm
    # host-only: never expose Postgres on the server's public IP
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fjm"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    container_name: firstjobjab-api
    restart: unless-stopped
    # Nginx Proxy Manager reaches it over the shared network as firstjobjab-api:9900
    networks: [default, proxy]
    env_file: .env
    environment:
      # same DB as native dev (fjm_demo); set DB_NAME in .env to use another DB
      DATABASE_URL: postgresql://fjm:${POSTGRES_PASSWORD:-fjm}@db:5432/${DB_NAME:-fjm_demo}
      NODE_ENV: production
      API_PORT: 9900
      OCR_URL: http://ocr:8765
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:9800}
      # proxy hops in front of the api: 0 = none, 1 = proxy manager, 2 = Cloudflare + proxy manager
      TRUST_PROXY: ${TRUST_PROXY:-0}
    # BIND_IP=127.0.0.1 (default) keeps it reachable only via the proxy manager / localhost; 0.0.0.0 to open on LAN
    ports: ["${BIND_IP:-127.0.0.1}:9900:9900"]
    volumes: ["./apps/api/uploads:/repo/apps/api/uploads"]
    depends_on: { db: { condition: service_healthy }, ocr: { condition: service_started } }
    profiles: [full]

  # PaddleOCR PP-OCRv5 Thai via RapidOCR (docs/ocr.md); internal only, api falls back to tesseract if it's down
  ocr:
    build: ./apps/ocr
    restart: unless-stopped
    profiles: [full]

  web:
    build:
      context: .
      target: web
      # baked into the browser bundle at build time: rebuild web after changing it
      args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:9900}" }
    container_name: firstjobjab-web
    restart: unless-stopped
    # Nginx Proxy Manager reaches it over the shared network as firstjobjab-web:9800
    networks: [default, proxy]
    environment:
      PORT: 9800 # next start
    ports: ["${BIND_IP:-127.0.0.1}:9800:9800"]
    depends_on: [api]
    profiles: [full]

networks:
  proxy:
    # The Docker network Nginx Proxy Manager is on; see "docker network ls".
    # No NPM (local dev)? create it once: docker network create npm_default
    name: ${NPM_NETWORK:-npm_default}
    external: true

volumes:
  # created by compose on first `up`; careful: `docker compose down -v` deletes the database
  dbdata:
    name: app_dbdata
