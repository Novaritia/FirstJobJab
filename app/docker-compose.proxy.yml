# Server override: join the existing Nginx Proxy Manager network (docs/deploy.md)
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml --profile full up -d --build
services:
  api:
    container_name: firstjobjab-api
    networks: [default, proxy]
    # Not published on the host: Nginx Proxy Manager reaches it over the shared network as firstjobjab-api:4000
    ports: !reset []

  web:
    container_name: firstjobjab-web
    networks: [default, proxy]
    # Nginx Proxy Manager reaches it as firstjobjab-web:3000
    ports: !reset []

networks:
  proxy:
    # The Docker network Nginx Proxy Manager is on; see "docker network ls"
    name: ${NPM_NETWORK:-npm_default}
    external: true
